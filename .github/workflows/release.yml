name: release
# Build the leetcode-zed companion binary for each platform and attach it to the
# GitHub release, with asset names that src/lib.rs downloads. Trigger: push a tag.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: leetcode-zed-aarch64-macos.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: leetcode-zed-x86_64-macos.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: leetcode-zed-x86_64-linux.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: leetcode-zed-x86_64-windows.exe.gz
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --manifest-path server/Cargo.toml --target ${{ matrix.target }}
      - name: Package (gzip the binary)
        shell: bash
        run: |
          bin=server/target/${{ matrix.target }}/release/leetcode-zed
          [ -f "$bin.exe" ] && bin="$bin.exe"
          gzip -c "$bin" > "${{ matrix.asset }}"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
